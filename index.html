<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffd43b" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Lemonade King — гра-тренажер підприємця для дітей" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lemonade King" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Lemonade King</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Lemonade King"></canvas>
      <div id="hud"></div>
      <button id="resources" class="res-bar hidden"></button>
      <div id="panel" class="hidden"></div>
      <button id="panel-toggle" class="panel-toggle hidden" type="button"></button>
      <div id="lemi" class="hidden" role="dialog" aria-live="polite"></div>
      <div id="modal" class="hidden" role="dialog" aria-modal="true"></div>
      <div id="toasts" aria-live="polite"></div>
      <div id="debug" class="hidden"></div>
      <div id="rotate" aria-hidden="true">
        <div class="rot-phone">📱</div>
        <b>Поверніть телефон горизонтально</b>
        <small>Rotate your phone sideways</small>
        <small>Rotește telefonul pe orizontală</small>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
